<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Lexora{% endblock %}</title>
<style>
:root{--ink:#1b1f24;--mute:#5c6670;--line:#dde2e7;--bg:#f6f7f9;--accent:#b5651d;--red:#c1121f;--green:#1f7a5c}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;gap:24px;align-items:center}
header b{font-size:18px;letter-spacing:.5px}header a{color:#cfd6dd;text-decoration:none}
main{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:0 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.haute{background:#fde8ea;color:var(--red)}.moyenne{background:#fdf1e3;color:var(--accent)}.faible{background:#e6f4ee;color:var(--green)}
.open{background:#eef1f4;color:var(--mute)}.sent_to_lawyer{background:#e6f4ee;color:var(--green)}
.msg{max-width:75%;padding:8px 12px;border-radius:10px;margin:6px 0;white-space:pre-wrap}
.in{background:#fff;border:1px solid var(--line)}.out{background:#dcf8c6;margin-left:auto}
.meta{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
button,input[type=submit]{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
input[type=text]{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px}
</style></head><body>
<header><b>Lexora</b><a href="/avocat">Espace avocat</a><a href="/simu">Simulateur WhatsApp</a></header>
<main>{% block body %}{% endblock %}</main></body></html>
